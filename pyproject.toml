[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pf-sintering"
version = "0.1.0"
description = "Python port of the v64 phase-field sintering model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "matplotlib>=3.8",
  "h5py>=3.10",
  "scikit-image>=0.23",
]

[project.scripts]
pf-sintering = "pf_sintering.cli:main"

[tool.setuptools.packages.find]
include = ["pf_sintering*"]
